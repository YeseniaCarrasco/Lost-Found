# Runs the pytest suite automatically so broken changes are caught early.
name: Tests

# When to run: on every pull request, and on every push to the main branch.
on:
  pull_request:
  push:
    branches: [main]

# The workflow only needs to read the code; it never writes or deploys anything.
permissions:
  contents: read

jobs:
  # A single job named "test" on a fresh Ubuntu machine.
  test:
    name: test
    runs-on: ubuntu-latest

    steps:
      # Download this repository's code onto the machine.
      - name: Check out code
        uses: actions/checkout@v4

      # Install Python 3.13 and reuse downloaded packages between runs to save time.
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      # Install the app's packages (Flask, etc.) plus pytest from requirements.txt.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Run the tests. They use a temporary SQLite file and a fake SECRET_KEY
      # (set in tests/conftest.py), so no database service or real secrets are needed.
      - name: Run pytest
        run: python -m pytest
